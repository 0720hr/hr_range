services:
  endpoint01:
    build: .
    image: hr_range/endpoint01:4.14.5
    container_name: endpoint01
    hostname: endpoint01
    restart: unless-stopped
    networks:
      - siem
    volumes:
      - endpoint01_var:/var/ossec
    environment:
      - WAZUH_MANAGER=wazuh.manager
      - WAZUH_AGENT_NAME=endpoint01

networks:
  siem:
    external: true
    name: siem_default

volumes:
  endpoint01_var:
